<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Descubre Carranque</title>
  <meta name="description" content="Mapa interactivo de comercios, asociaciones y cultura de Carranque (Toledo).">
  <meta name="theme-color" content="#f5f1ea">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Fraunces:opsz,wght,SOFT@9..144,400..700,0..100&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="cabecera">
    <div class="cabecera-inner">
      <h1 class="titulo" id="titulo-texto">Descubre Carranque</h1>
      <p class="subtitulo" id="subtitulo-texto"></p>

      <form class="buscador" role="search" onsubmit="return false">
        <label for="buscar" class="visualmente-oculto">Buscar comercio o asociación</label>
        <span class="lupa" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.4"/><line x1="15.5" y1="15.5" x2="21" y2="21" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
        </span>
        <input id="buscar" type="search" autocomplete="off" placeholder="Busca un comercio, asociación…">
        <button type="button" id="borrar-busqueda" class="borrar" aria-label="Borrar búsqueda" hidden>✕</button>
      </form>

      <nav class="pestanas" id="pestanas" aria-label="Qué quieres descubrir"></nav>
      <div class="chips" id="chips" aria-label="Categorías"></div>
    </div>
  </header>

  <main class="principal">
    <section class="panel-lista" aria-label="Resultados">
      <p class="contador" id="contador" aria-live="polite"></p>
      <ul class="lista" id="lista"></ul>
    </section>
    <section class="panel-mapa" aria-label="Mapa">
      <div id="mapa"></div>
      <button type="button" class="btn-centrar" id="btn-centrar" title="Ver todo el pueblo">🏠 Ver todo</button>
    </section>
  </main>

  <footer class="pie">
    <p>Descubre Carranque · Proyecto vecinal · <a href="qr.html">Código QR</a> · <a href="gestion/" rel="nofollow">Acceso gestores</a></p>
    <p class="pie-aviso" id="aviso-ejemplo" hidden>⚠️ La información mostrada es de ejemplo mientras se recopilan los datos reales.</p>
  </footer>

  <!-- Ficha completa (landing page de cada lugar) -->
  <div class="ficha-fondo" id="ficha-fondo" hidden></div>
  <article class="ficha" id="ficha" role="dialog" aria-modal="true" aria-labelledby="ficha-nombre" hidden tabindex="-1"></article>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="js/config.js"></script>
  <script src="js/estilo-mapa.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/fuente-datos.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
